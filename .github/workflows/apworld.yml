name: World

on:
  push:
    branches: [dev]
    paths-ignore: ['*.md', 'assets/**', 'site/**']
  pull_request:
    paths-ignore: ['*.md', 'assets/**', 'site/**']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Archipelago 0.6.8, as in tools/apworld-test.ps1.
  AP_REF: 54803be064fc7e80c4628777ed0b46a9390f255f

jobs:
  test:
    # A dev to main pull request has the same commit the push to dev is already testing.
    if: github.event_name != 'pull_request' || github.head_ref != 'dev'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          path: world
      - uses: actions/checkout@v4
        with:
          repository: ArchipelagoMW/Archipelago
          ref: ${{ env.AP_REF }}
          path: archipelago
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: archipelago/ci-requirements.txt
      - name: Install Archipelago
        working-directory: archipelago
        run: |
          python -m pip install -r ci-requirements.txt
          python ModuleUpdate.py --yes --force --append WebHostLib/requirements.txt
          python Launcher.py --update_settings
      - name: Pack the world
        run: |
          python world/tools/build_apworld.py --dir archipelago/worlds/ootxmm
          python world/tools/prune_worlds.py archipelago
          python world/tools/build_apworld.py ootxmm.apworld
      - name: Check seed generation and client protocol
        working-directory: archipelago
        env:
          SKIP_REQUIREMENTS_UPDATE: "1"
        run: python -m pytest worlds/ootxmm/test/test_options.py::TestDefaults worlds/ootxmm/test/test_client.py -q
      - uses: actions/upload-artifact@v4
        with:
          name: ootxmm.apworld
          path: ootxmm.apworld

  host-helper:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check Windows helper syntax
        shell: powershell
        run: |
          $parseErrors = $null
          $tokens = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$pwd/tools/host-setup.ps1", [ref]$tokens, [ref]$parseErrors) | Out-Null
          if ($parseErrors) { throw ($parseErrors | Out-String) }
      - run: python -m unittest discover -s tools -p test_package_host.py
      - run: python tools/package_host.py dist/ootxmm-host.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ootxmm-host
          path: |
            dist/ootxmm-host.zip
            dist/ootxmm-host.zip.sha256
